name: Build DLL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Match your target project version

    - name: Install dependencies
      run: dotnet restore

    - name: Build Release DLL
      run: dotnet build --configuration Release --no-restore

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-compiled-dll
        # This searches for any .dll files inside your bin/Release/ folder
        path: '**/bin/Release/**/*.dll'
